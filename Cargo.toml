[workspace]
members = [".", "web"]
resolver = "2"

[package]
name = "forge"
version = "0.2.0"
edition = "2021"
description = "An agent-native 2D game engine: text worlds, a JSON-lines protocol, scripts that run in the engine loop."

[lib]
name = "forge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rhai = { version = "1", features = ["serde"] }

# The web player: no clock and no OS randomness in the browser build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version = "1", default-features = false, features = ["std", "serde", "no_time"] }

[profile.release.package.forge-web]
opt-level = "s"
